name: Build IRONFALL Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --quit
      - name: Build APK
        run: mkdir -p build && godot --headless --path . --export-release "Android" build/IRONFALL.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONFALL-Android
          path: build/IRONFALL.apk
