name: Build IRONFALL Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Validate Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          godot --version
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -n "${JAVA_HOME:-}"
          test -f project.godot
          test -f export_presets.cfg
          grep -q '^name="Android"$' export_presets.cfg
          grep -q '^package/signed=false$' export_presets.cfg

      - name: Configure Godot Android SDK/JDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit --verbose
          test -f project.godot
          test -f main.tscn

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/IRONFALL.apk 2>&1 | tee build/export.log
          test -s build/IRONFALL.apk

      - name: Inspect APK
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh build/IRONFALL.apk
          file build/IRONFALL.apk
          unzip -t build/IRONFALL.apk >/dev/null
          test -s build/IRONFALL.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IRONFALL-Android
          path: build/IRONFALL.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IRONFALL-build-diagnostics
          path: |
            build/export.log
            .godot/editor/
          if-no-files-found: ignore
          retention-days: 7
