name: Build IRONFALL Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Import project
        run: godot --headless --editor --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/IRONFALL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONFALL-Android
          path: build/IRONFALL.apk